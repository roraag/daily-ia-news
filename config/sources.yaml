# ============================================================
# CRYPTO — fuentes y datos para la sección "Bitcoin Watch"
# ============================================================
# IMPORTANTE: este bloque NO entra al ranking de IA (Paso 5). NO compite por
# aparecer en "Lo que importa hoy". Alimenta EXCLUSIVAMENTE la sección Bitcoin
# Watch al final del diario. Misma separación de universos que sources vs voices.
#
# Encuadre obligatorio: señales con fuente, NUNCA profecías. No dar fecha de alt
# season. Cada dato lleva fuente + hora. Si una API falla, omitir ese dato (no
# inventar).
# ============================================================

crypto:
  # ----- Medios (noticia de fondo: ETF, regulación, macro) -----
  media:
    - name: CoinDesk
      url: https://www.coindesk.com/
      rss: https://www.coindesk.com/arc/outboundfeeds/rss/
      weight: 3
      language: en

    - name: Cointelegraph
      url: https://cointelegraph.com/
      rss: https://cointelegraph.com/rss
      weight: 2
      language: en

    - name: Decrypt
      url: https://decrypt.co/
      rss: https://decrypt.co/feed
      weight: 2
      language: en

    - name: Bitcoin Magazine
      url: https://bitcoinmagazine.com/
      rss: null  # RSS directo da 403; usar fallback Google News site:bitcoinmagazine.com
      weight: 1
      language: en

  # ----- Datos de mercado (pulso + señales). Traer con curl (Bash). -----
  # Validado 2026-06-14: los 3 endpoints responden el JSON esperado.
  market_data:
    - name: BTC precio + variaciones + market cap
      endpoint: "https://api.coingecko.com/api/v3/coins/bitcoin?localization=false&tickers=false&market_data=true&community_data=false&developer_data=false"
      campos: "market_data.current_price.usd, market_data.price_change_percentage_24h, market_data.price_change_percentage_7d, market_data.market_cap.usd"

    - name: Dominancia BTC y ETH
      endpoint: "https://api.coingecko.com/api/v3/global"
      campos: "data.market_cap_percentage.btc, data.market_cap_percentage.eth"

    - name: Fear & Greed Index
      endpoint: "https://api.alternative.me/fng/?limit=1"
      campos: "data[0].value, data[0].value_classification"

    - name: Ratio ETH/BTC
      endpoint: "https://api.coingecko.com/api/v3/simple/price?ids=ethereum&vs_currencies=btc"
      campos: "ethereum.btc"

  # ----- Contexto fijo del ciclo -----
  ciclo:
    ultimo_halving: "2024-04-20"   # bloque 840.000
    proximo_halving_estimado: "~2028"
    nota: "Computar días desde el último halving para ubicar la fase del ciclo. NO predecir precio ni fecha de alt season."
