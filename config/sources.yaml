# Pool de fuentes para Daily IA News
#
# Dos bloques:
#   sources: medios y blogs editoriales (producen noticias)
#   voices:  panel humano (founders / especialistas / críticos — producen takes y señales)
#
# Categorías de sources: tech | business | health
# Peso: 1 (básico) a 3 (alta prioridad). Pondera en el ranking.
# Language: en | es

sources:
