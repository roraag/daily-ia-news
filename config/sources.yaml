# ============================================================
# PANEL HUMANO — voces, no medios
# ============================================================
# El panel NO produce noticias. Produce dos cosas:
#   1) Takes que se citan dentro del "ángulo editorial" de noticias existentes.
#   2) Señales tempranas para Anthropic Watch y El Bolsillo.
#
# Si una voz no dijo nada relevante en las últimas 24h → no aparece. Cero relleno.
#
# Cascada de fetch por voz (ver prompts/daily-pipeline.md):
#   - Si tiene blog/RSS: WebFetch al RSS (lo más confiable, 90%+).
#   - Si no: Nitter (nitter.net/handle/rss) → xcancel.com/handle → Google News
#     con query `"@handle" (AI OR Anthropic OR OpenAI)`.
# ============================================================

